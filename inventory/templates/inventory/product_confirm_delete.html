{% extends 'inventory/base.html' %}

{% block title %}Eliminar Producto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-5 text-center">
            <!-- Icono de advertencia vibrante -->
            <div class="text-danger mb-4">
                <i class="fas fa-exclamation-triangle fa-4x"></i>
            </div>

            <h1 class="fw-bold mb-4">¿Estás seguro?</h1>
            <p class="text-muted mb-5">
                Estás a punto de eliminar el producto <strong class="text-dark">"{{ object.name }}"</strong> del
                inventario.
                Esta acción no se puede deshacer.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-danger btn-vibrant py-3 shadow">
                        <i class="fas fa-trash-alt me-2"></i>Sí, eliminar definitivamente
                    </button>
                    <a href="{% url 'product_list' %}" class="btn btn-link text-muted">No, cancelar y volver</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
