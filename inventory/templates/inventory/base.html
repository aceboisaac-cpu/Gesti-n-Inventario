<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | {% block title %}{% endblock %}</title>

    <!-- Bootstrap 5 & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --vibrant-blue: #007bff;
            --vibrant-green: #28a745;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar con Efecto Glass */
        .sidebar {
            width: 280px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            padding: 2rem 1.5rem;
            z-index: 1000;
        }

        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 3rem;
        }

        .nav-link {
            color: #333;
            font-weight: 600;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            margin-bottom: 0.5rem;
        }

        .nav-link:hover,
        .nav-link.active {
            background: var(--vibrant-blue);
            color: white !important;
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        /* Tarjetas con efecto Glass */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .btn-vibrant {
            border-radius: 12px;
            font-weight: 600;
            padding: 0.6rem 1.5rem;
            transition: all 0.3s ease;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h3 class="mb-5 text-primary fw-bold"><i class="fas fa-boxes-stacked me-2"></i>INV PRO</h3>
        <nav class="nav flex-column">
            <a class="nav-link {% if request.resolver_match.url_name == 'product_list' %}active{% endif %}"
                href="{% url 'product_list' %}">
                <i class="fas fa-list me-2"></i> Inventario
            </a>
            <a class="nav-link {% if request.resolver_match.url_name == 'product_create' %}active{% endif %}"
                href="{% url 'product_create' %}">
                <i class="fas fa-plus-circle me-2"></i> Nuevo Producto
            </a>
        </nav>

        <div class="mt-auto">
            <small class="text-muted">v1.0 - Gestión de Inventario</small>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
